<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
                        url("{% static 'bg.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: white;
        }

        /* NAVBAR */
        .navbar-custom {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        .navbar-brand {
            color: #00ffc8 !important;
            font-weight: 700;
            font-size: 22px;
        }

        .nav-link {
            color: white !important;
            margin-left: 20px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #00ffc8 !important;
            transform: scale(1.1);
        }

        /* ALERTS */
        .alert-box {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
        }

        .custom-alert {
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 10px;
            color: white;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            animation: slideIn 0.5s ease;
        }

        .alert-success {
            background: rgba(0, 255, 150, 0.2);
            border-left: 5px solid #00ff96;
        }

        .alert-error {
            background: rgba(255, 0, 80, 0.2);
            border-left: 5px solid #ff0050;
        }

        .alert-warning {
            background: rgba(255, 200, 0, 0.2);
            border-left: 5px solid #ffc107;
        }

        @keyframes slideIn {
            from {transform: translateX(100%); opacity: 0;}
            to {transform: translateX(0); opacity: 1;}
        }

        /* LOGIN CARD */
        .login-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            margin: 140px auto;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .form-title {
            text-align: center;
            font-size: 24px;
            color: #00ffc8;
            margin-bottom: 10px;
        }

        .form-subtitle {
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 25px;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #00ffc8;
        }

        .form-control {
            background: transparent !important;
            border: 1px solid rgba(255,255,255,0.3);
            color: white !important;
            padding-left: 40px;
            height: 45px;
            caret-color: #00ffc8;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .form-control:focus {
            border-color: #00ffc8;
            box-shadow: none;
        }

        .btn-login {
            background: linear-gradient(45deg, #00ffc8, #007bff);
            border: none;
            border-radius: 30px;
            color: black;
            font-weight: 600;
        }

        .btn-login:hover {
            box-shadow: 0 0 15px #00ffc8;
        }

        .alt-links a {
            color: #00ffc8;
            text-decoration: none;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">🌍 Climate AI</a>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            ☰
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="nav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'base' %}">
                        <i class="fa fa-home"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">
                        <i class="fa fa-users"></i> Users
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'Register1' %}">
                        <i class="fa fa-user-plus"></i> Register
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'serviceproviderlogin' %}">
                        <i class="fa fa-user-shield"></i> Admin
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ALERTS -->
<div class="alert-box">
    {% if messages %}
        {% for message in messages %}
            <div class="custom-alert 
                {% if message.tags == 'success' %}alert-success{% endif %}
                {% if message.tags == 'error' %}alert-error{% endif %}
                {% if message.tags == 'warning' %}alert-warning{% endif %}">
                
                <i class="fa 
                    {% if message.tags == 'success' %}fa-check-circle{% endif %}
                    {% if message.tags == 'error' %}fa-times-circle{% endif %}
                    {% if message.tags == 'warning' %}fa-exclamation-triangle{% endif %}">
                </i>
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>

<!-- ADMIN LOGIN -->
<div class="login-container">
    <div class="form-title">Admin Login</div>
    <div class="form-subtitle">Secure access for service providers</div>

    <form method="POST" action="{%url 'serviceproviderlogin'%}">
        {% csrf_token %}

        <div class="mb-3 position-relative">
            <i class="fa fa-user input-icon"></i>
            <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>

        <div class="mb-3 position-relative">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <div class="d-grid">
            <button type="submit" name="submit1" class="btn btn-login">Login</button>
        </div>
    </form>

    <div class="text-center mt-3 alt-links">
        <a href="{% url 'login' %}">User Login</a>
    </div>
</div>

<!-- AUTO HIDE ALERT -->
<script>
    setTimeout(() => {
        document.querySelectorAll('.custom-alert').forEach(alert => {
            alert.style.opacity = '0';
            setTimeout(() => alert.remove(), 500);
        });
    }, 3000);
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
