<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.7)),
                        url("{% static 'bg.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar-custom {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        .navbar-brand {
            color: #00ffc8 !important;
            font-weight: 700;
            font-size: 22px;
        }

        .nav-link {
            color: white !important;
            margin-left: 20px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #00ffc8 !important;
            transform: scale(1.1);
        }

        /* REGISTER CARD */
        .register-container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 120px auto;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: fadeIn 1s ease-in-out;
        }

        .form-title {
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            color: #00ffc8;
            margin-bottom: 25px;
        }

        /* INPUT */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #00ffc8;
            z-index: 2;
        }

        .form-control {
            background: transparent !important;
            border: 1px solid rgba(255,255,255,0.3);
            color: white !important;
            padding-left: 40px;
            height: 45px;
            caret-color: #00ffc8;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .form-control:focus {
            border-color: #00ffc8;
            box-shadow: none;
        }

        input:-webkit-autofill {
            -webkit-text-fill-color: white !important;
            -webkit-box-shadow: 0 0 0px 1000px transparent inset !important;
        }

        /* BUTTON */
        .btn-register {
            background: linear-gradient(45deg, #00ffc8, #007bff);
            border: none;
            border-radius: 30px;
            color: black;
            font-weight: 600;
            padding: 10px;
            transition: 0.3s;
        }

        .btn-register:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ffc8;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            color: #00ffc8;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(30px);}
            to {opacity: 1; transform: translateY(0);}
        }
        /* ALERTS */
        .alert-box {
            position: fixed;
            top: 90px;
            right: 20px;
            z-index: 9999;
            min-width: 320px;
        }

        .custom-alert {
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 10px;
            color: white;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            animation: slideIn 0.5s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .alert-success {
            background: rgba(0, 255, 150, 0.2);
            border-left: 5px solid #00ff96;
        }

        .alert-error {
            background: rgba(255, 0, 80, 0.2);
            border-left: 5px solid #ff0050;
        }

        .alert-warning {
            background: rgba(255, 200, 0, 0.2);
            border-left: 5px solid #ffc107;
        }

        @keyframes slideIn {
            from {transform: translateX(100%); opacity: 0;}
            to {transform: translateX(0); opacity: 1;}
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">🌍 Climate AI</a>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            ☰
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="nav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'base' %}">
                        <i class="fa fa-home"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">
                        <i class="fa fa-users"></i> Users
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'Register1' %}">
                        <i class="fa fa-user-plus"></i> Register
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'serviceproviderlogin' %}">
                        <i class="fa fa-user-shield"></i> Admin
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- DJANGO ALERT MESSAGES -->
<div class="alert-box">
    {% if messages %}
        {% for message in messages %}
            <div class="custom-alert alert-{{ message.tags }}">
                <i class="fa 
                    {% if message.tags == 'success' %}fa-check-circle{% endif %}
                    {% if message.tags == 'error' %}fa-times-circle{% endif %}
                    {% if message.tags == 'warning' %}fa-exclamation-triangle{% endif %}
                "></i>
                <span>{{ message }}</span>
            </div>
        {% endfor %}
    {% endif %}
</div>

<!-- REGISTER FORM -->
<div class="register-container">
    <div class="form-title">Create Your Account</div>

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <i class="fa fa-user input-icon"></i>
            <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>

        <div class="input-group">
            <i class="fa fa-envelope input-icon"></i>
            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <div class="input-group">
            <i class="fa fa-phone input-icon"></i>
            <input type="number" name="phoneno" class="form-control" placeholder="Mobile Number" required>
        </div>

        <div class="input-group">
            <i class="fa fa-globe input-icon"></i>
            <input type="text" name="country" class="form-control" placeholder="Country" required>
        </div>

        <div class="input-group">
            <i class="fa fa-map input-icon"></i>
            <input type="text" name="state" class="form-control" placeholder="State" required>
        </div>

        <div class="input-group">
            <i class="fa fa-city input-icon"></i>
            <input type="text" name="city" class="form-control" placeholder="City" required>
        </div>

        <div class="d-grid mt-3">
            <button type="submit" class="btn btn-register">Register</button>
        </div>
    </form>

    <div class="login-link">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
setTimeout(() => {
    document.querySelectorAll('.custom-alert').forEach(alert => {
        alert.style.opacity = '0';
        setTimeout(() => alert.remove(), 500);
    });
}, 3000);
</script>
</body>
</html>
