<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Climate Impact Dashboard</title>
    <link href="https://fonts.googleapis.com/css?family=Fredoka+One|Righteous" rel="stylesheet">
    <style type="text/css">
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://via.placeholder.com/1920x1080?text=Agricultural+Field') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Righteous', cursive;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: rgba(46, 92, 82, 0.9); /* Green with transparency */
            padding: 40px;
            border-radius: 15px;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-in;
        }
        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #f4d03f; /* Soft yellow */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #fff;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #8e4fd1; /* Purple accent */
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2rem;
            margin: 10px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #6d3ca1;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            p {
                font-size: 1rem;
            }
            .container {
                padding: 20px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Climate Change Impact on Agriculture</h1>
        <p>Explore how climate change affects agricultural land suitability across Eurasia using interpretable machine learning. Predict impacts, analyze data, and secure food systems for the future.</p>
        <a href="#" class="btn">Get Started</a>
        <a href="#" class="btn">Learn More</a>
    </div>
</body>
</html>
